<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9a5b00">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>PCM · TESTE Equipamentos</title>
<link rel="icon" href="../icons/icon-192.png">
<style>
:root{--bg:#f3f4f1;--sf:#fff;--fg:#1c201e;--mu:#5c655e;--ln:#dde1dc;--ac:#0b6e4f;--ac2:#e5f2ec;--wa:#9a5b00;--wa2:#fdf1dc;--cr:#b3261e;--cr2:#fbe7e5;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#111412;--sf:#1a1f1c;--fg:#e8ece9;--mu:#9aa49d;--ln:#2b322d;--ac:#4cc59a;--ac2:#1b2d25;--wa:#e0a74a;--wa2:#2e2513;--cr:#f2867d;--cr2:#341b19}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 12px}
.teste{background:var(--wa);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:5px 10px}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 0 8px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;flex:1}
.back{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.st{font-size:12px;color:var(--mu)}
.q{width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);font-size:16px}
main{padding:6px 0 60px}
.area{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px}
.area b{font-size:13px;letter-spacing:.05em;color:var(--ac);text-transform:uppercase}
.area span{font-size:12px;color:var(--mu)}
.list{display:grid;gap:8px}
.card{display:flex;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%;align-items:flex-start}
.tagbox{flex:none;min-width:86px;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:13px;color:var(--ac);background:var(--ac2);border-radius:8px;padding:6px 8px;text-align:center}
.ci{flex:1;min-width:0}
.cd{font-weight:600}
.cm{font-size:12px;color:var(--mu);margin-top:3px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--ln);margin:4px 4px 0 0;color:var(--mu)}
.pill b{color:var(--fg)}
.pill.ok{background:var(--ac2);border-color:transparent;color:var(--ac)}
.pill.w{background:var(--wa2);border-color:transparent;color:var(--wa)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 6px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
.row{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:start}
.row .t{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:12.5px;color:var(--ac)}
.row .d{font-size:13.5px}
.row .x{font-size:11.5px;color:var(--mu);margin-top:2px}
.row .r{text-align:right;font-size:12px;color:var(--mu);white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px;text-align:center}
.sum b{display:block;font-size:20px}
.sum span{font-size:11px;color:var(--mu)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin:12px 0}
.empty{padding:30px 0;text-align:center;color:var(--mu)}
.note{font-size:12px;color:var(--mu);margin-top:6px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--ac2);color:var(--ac);font-weight:600}
.tag.w{background:var(--wa2);color:var(--wa)}.tag.c{background:var(--cr2);color:var(--cr)}
a{color:var(--ac)}
</style>
</head>
<body>
<div class="teste">VERSÃO DE TESTE · somente leitura · nada é gravado na planilha</div>
<header><div class="wrap">
  <div class="top"><button class="back" id="bk" hidden>← Voltar</button><h1 id="ttl">Equipamentos por Setor/TAG</h1></div>
  <div class="st" id="stx">Carregando…</div>
  <input id="q" class="q" type="search" placeholder="Buscar TAG, setor, código, descrição…">
</div></header>
<main class="wrap" id="view"></main>
<script src="eletrica_data.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const titulo=n=>{let t=String(n).toLowerCase().replace(/(^|[\s\-(\/])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase());['De','Da','Do','Das','Dos','Para','E','Com','Ou','Em'].forEach(w=>{t=t.replace(new RegExp(' '+w+' ','g'),' '+w.toLowerCase()+' ');});return t.replace(/\bTam\b/g,'TAM').replace(/\bIhm\b/g,'IHM');};

/* famílias pela TAG */
const FAM={MI:'Motor (inversor)',MD:'Motor (partida direta)',MS:'Motobomba',FM:'Freio do motor',EN:'Encoder',SI:'Sensor indutivo',SE:'Sensor óptico emissor',SR:'Sensor óptico receptor',SF:'Sensor óptico difuso',SC:'Fim de curso / microswitch',SM:'Sensor magnético de segurança',SS:'Sensor de monitoramento',SP:'Sensor de pressão',SN:'Sensor de nível',BC:'Botoeira de comando',BE:'Botoeira de emergência',BP:'Botoeira de parada',BR:'Botoeira de reset',VS:'Válvula solenoide',VA:'Válvula solenoide',VR:'Válvula solenoide',EI:'Eletroímã',TV:'Trava de segurança',CS:'Corda de segurança',CL:'Coluna sonora / sinaleiro',QC:'Quadro elétrico',QR:'Quadro remoto / cabo',RE:'Antena wireless',AT:'Alimentação'};
const GRUPOS=['Motores','Sensores e segurança','Botoeiras','Válvulas','Outros'];
function fam(tag,desc){const p=(String(tag).match(/^[A-Z]+/)||[''])[0];if(FAM[p])return FAM[p];return /QUADRO/.test(desc)?'Quadro elétrico':'Outros';}
function grupo(f){if(/^Motor|Motobomba|Freio|Encoder/.test(f))return 'Motores';if(/^Botoeira/.test(f))return 'Botoeiras';if(/Válvula|Eletroímã/.test(f))return 'Válvulas';if(/^Sensor|Fim de curso|Trava|Corda/.test(f))return 'Sensores e segurança';return 'Outros';}

/* áreas pelo prefixo do setor */
const AREA={GER:'Geral · quadros e auxiliares',ZSB:'Zona suja',ZLB:'Zona limpa'};
const pref=s=>(String(s).match(/^[A-Z]+/)||['?'])[0];

/* ---- dados elétricos (planilha da planta nova) ---- */
const EQ=ELE.eqs.map((e,i)=>({i,setor:e[0],nome:titulo(e[1]),modelo:e[2],of:e[3],qtd:e[4],itens:[]}));
ELE.it.forEach(x=>{const f=fam(x[1],x[2]);EQ[x[0]].itens.push({tag:x[1],desc:x[2],kw:x[3],lig:x[4],vias:x[5],quadro:x[6],cod:x[7],fam:f,grp:grupo(f)});});

/* ---- dados do PCM (lidos do app, sem gravar) ---- */
let PCM=null;
function aba(n){return (PCM&&PCM.abas&&PCM.abas[n])||{cab:[],linhas:[]};}
function col(cab,...n){for(const k of n){const x=norm(k);let i=cab.findIndex(c=>norm(c)===x);if(i<0)i=cab.findIndex(c=>norm(c).startsWith(x));if(i>=0)return i;}return -1;}
function v(a,r,...n){const i=col(a.cab,...n);return i>=0?r[i]:'';}
const codN=c=>String(c||'').replace(/\D/g,'');
async function carrega(){
  // 1) cópia local que o app já guardou (funciona sem internet)
  try{
    PCM=await new Promise((ok,ko)=>{const r=indexedDB.open('pcm-gassen');r.onupgradeneeded=ev=>{ev.target.transaction.abort();};r.onerror=()=>ok(null);r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains('kv')){ok(null);return;}const t=db.transaction('kv','readonly').objectStore('kv').get('dados');t.onsuccess=()=>ok(t.result||null);t.onerror=()=>ok(null);};});
  }catch(e){PCM=null;}
  $('#stx').textContent=PCM?'Dados do PCM: cópia do app neste aparelho · planilha elétrica: planta nova (Sulmaq)':'Abra o app PCM e entre uma vez neste aparelho para ver peças e manutenções aqui.';
  indexa();render();
}
/* índices de ligação */
let PE=[],MAN=[],MOT={},SER={};
function indexa(){
  const p=aba('Peças'),m=aba('Manutenção'),mo=aba('Motores'),mp=aba('manuais_pecas');
  PE=p.linhas.map(r=>({id:r[0],eq:v(p,r,'Equipamento'),cod:v(p,r,'Código'),desc:v(p,r,'Descrição'),fab:v(p,r,'Fabricante'),est:v(p,r,'Estoque atual'),min:v(p,r,'Estoque mín'),local:v(p,r,'Local')}));
  MAN=m.linhas.map(r=>({id:r[0],eq:v(m,r,'Equipamento'),tipo:v(m,r,'Tipo','Área'),tarefa:v(m,r,'Tarefa'),per:v(m,r,'Periodicidade'),st:v(m,r,'Status'),ult:v(m,r,'Última'),prox:v(m,r,'Próxima')}));
  MOT={};mo.linhas.forEach(r=>{MOT[String(r[0]).trim()]={funcao:v(mo,r,'Função'),pot:v(mo,r,'Potência'),acion:v(mo,r,'Acionamento'),modelo:v(mo,r,'Modelo'),disj:v(mo,r,'Disjuntor'),freio:v(mo,r,'Freio')};});
  SER={};mp.linhas.forEach(r=>{const o=v(mp,r,'Aba origem');if(!o)return;(SER[o]=SER[o]||[]).push({id:r[0],cod:v(mp,r,'Código'),desc:v(mp,r,'Descrição'),fab:v(mp,r,'Fabricante'),item:v(mp,r,'Item'),qtd:v(mp,r,'Qtd'),est:v(mp,r,'Estoque atual')});});
  const porCod={};PE.forEach(x=>{const c=codN(x.cod);if(c)(porCod[c]=porCod[c]||[]).push(x);});
  EQ.forEach(e=>{
    e.itens.forEach(it=>{it.pecas=porCod[codN(it.cod)]||[];it.motor=MOT[it.tag]||null;});
    const quadro=/^Quadro Principal/.test(e.nome);
    const set=new Map();
    PE.forEach(x=>{if(norm(x.eq)===norm(e.setor)||(quadro&&norm(x.eq)==='quadro'))set.set(x.id,x);});
    e.itens.forEach(it=>it.pecas.forEach(x=>set.set(x.id,x)));
    e.pecas=[...set.values()];
    e.man=MAN.filter(t=>norm(t.eq)===norm(e.setor));
    e.motores=e.itens.filter(it=>it.grp==='Motores').length;
  });
}
/* ---- telas ---- */
const S={tela:'lista',eq:null,aba:'eletrica',q:''};
function render(){
  $('#bk').hidden=S.tela==='lista';
  if(S.tela==='lista') lista(); else if(S.tela==='eq') detalhe(EQ[S.eq]); else serra(S.eq);
}
const bate=t=>!S.q||norm(t).includes(S.q);
function lista(){
  $('#ttl').textContent='Equipamentos por Setor/TAG';
  const eqs=EQ.filter(e=>bate(e.setor+' '+e.nome+' '+e.modelo+' '+e.itens.map(i=>i.tag+' '+i.desc+' '+i.cod).join(' ')));
  const areas=[];eqs.forEach(e=>{const p=pref(e.setor);if(areas.indexOf(p)<0)areas.push(p);});
  const ordA=['GER','ZSB','ZLB'];areas.sort((a,b)=>{const i=ordA.indexOf(a),j=ordA.indexOf(b);return ((i<0?9:i)-(j<0?9:j))||a.localeCompare(b);});
  const tot=EQ.reduce((s,e)=>s+e.itens.length,0);
  let h='<div class="sum"><div><b>'+EQ.length+'</b><span>equipamentos (planta nova)</span></div><div><b>'+tot+'</b><span>itens elétricos</span></div><div><b>'+EQ.reduce((s,e)=>s+e.motores,0)+'</b><span>motores / freios / encoders</span></div><div><b>'+Object.keys(SER).length+'</b><span>equipamentos dos manuais</span></div></div>';
  if(!eqs.length&&!Object.keys(SER).some(bate)) h+='<div class="empty">Nada encontrado.</div>';
  areas.forEach(a=>{
    const E=eqs.filter(e=>pref(e.setor)===a).sort((x,y)=>x.setor.localeCompare(y.setor,'pt',{numeric:true}));
    h+='<div class="area"><b>'+esc(a)+'</b><span>'+esc(AREA[a]||'')+' · '+E.length+' equipamento'+(E.length>1?'s':'')+'</span></div><div class="list">'+E.map(e=>{
      const g=GRUPOS.map(n=>[n,e.itens.filter(i=>i.grp===n).length]).filter(x=>x[1]);
      return '<button class="card" data-e="'+e.i+'"><div class="tagbox">'+esc(e.setor)+'</div><div class="ci"><div class="cd">'+esc(e.nome)+(e.qtd>1?' <span class="tag w">'+e.qtd+'×</span>':'')+'</div><div class="cm">'+esc(e.modelo||e.of)+'</div><div>'+g.map(([n,c])=>'<span class="pill">'+esc(n)+' <b>'+c+'</b></span>').join('')+(e.pecas.length?'<span class="pill ok">Peças no PCM <b>'+e.pecas.length+'</b></span>':'')+(e.man.length?'<span class="pill ok">Manutenção <b>'+e.man.length+'</b></span>':'<span class="pill w">sem plano de manutenção</span>')+'</div></div></button>';}).join('')+'</div>';
  });
  const sr=Object.keys(SER).filter(n=>bate(n+' '+SER[n].map(p=>p.cod+' '+p.desc).join(' ')));
  if(sr.length){
    h+='<div class="area"><b>Manuais</b><span>serras, balancins e outros fabricantes · '+sr.length+' equipamentos</span></div><div class="list">'+sr.map(n=>'<button class="card" data-s="'+esc(n)+'"><div class="tagbox">MANUAL</div><div class="ci"><div class="cd">'+esc(n)+'</div><div><span class="pill ok">Peças do manual <b>'+SER[n].length+'</b></span><span class="pill w">Setor/TAG a definir</span></div></div></button>').join('')+'</div>';
  }
  $('#view').innerHTML=h;
  $('#view').onclick=e=>{const c=e.target.closest('[data-e]');if(c){S.tela='eq';S.eq=+c.dataset.e;S.aba='eletrica';scrollTo(0,0);render();return;}const s=e.target.closest('[data-s]');if(s){S.tela='serra';S.eq=s.dataset.s;scrollTo(0,0);render();}};
}
function detalhe(e){
  $('#ttl').textContent=e.setor+' · '+e.nome;
  const tabs=[['eletrica','Elétrica ('+e.itens.length+')'],['pecas','Peças ('+e.pecas.length+')'],['man','Manutenção ('+e.man.length+')'],['info','Dados']];
  let h='<div class="tabs">'+tabs.map(([k,t])=>'<button data-a="'+k+'" aria-pressed="'+(S.aba===k)+'">'+esc(t)+'</button>').join('')+'</div>';
  if(S.aba==='eletrica'){
    const I=e.itens.filter(i=>bate(i.tag+' '+i.desc+' '+i.cod+' '+i.fam));
    GRUPOS.forEach(g=>{const G=I.filter(i=>i.grp===g);if(!G.length)return;
      h+='<div class="grp">'+esc(g)+' · '+G.length+'</div><div class="list">'+G.map(i=>{
        const m=i.motor,p=i.pecas[0];
        const extra=[i.fam,i.kw&&i.kw!=='-'?i.kw+' kW':'',i.lig,i.vias&&i.vias!=='-'?i.vias+' vias':'',i.quadro?'quadro '+i.quadro:''].filter(Boolean).join(' · ');
        return '<div class="row"><div class="t">'+esc(i.tag||'—')+'</div><div><div class="d">'+esc(i.desc)+'</div><div class="x">'+esc(extra)+'</div>'+
          (m?'<div class="x"><span class="tag">Motores</span> '+esc([m.pot,m.acion,m.modelo,m.disj?'disj. '+m.disj:'',m.freio?'freio '+m.freio:''].filter(Boolean).join(' · '))+'</div>':'')+
          (p?'<div class="x"><span class="tag">Peça '+esc(i.pecas.map(x=>x.id).join(', '))+'</span> '+esc(p.desc)+' · estoque '+esc(p.est||'0')+(p.local?' · '+esc(p.local):'')+'</div>':'')+
          '</div><div class="r">'+(i.cod?'cód. '+esc(i.cod):'')+'</div></div>';}).join('')+'</div>';});
    if(!I.length) h+='<div class="empty">Nenhum item.</div>';
  }
  if(S.aba==='pecas'){
    const P=e.pecas.filter(p=>bate(p.id+' '+p.cod+' '+p.desc+' '+p.fab));
    h+=P.length?'<div class="list">'+P.map(p=>{const falta=Number(String(p.min).replace(',','.'))>0&&Number(String(p.est).replace(',','.'))<Number(String(p.min).replace(',','.'));return '<div class="row"><div class="t">'+esc(p.id)+'</div><div><div class="d">'+esc(p.desc)+'</div><div class="x">'+esc([p.cod,p.fab,p.local].filter(Boolean).join(' · '))+'</div></div><div class="r">'+esc(p.est||'0')+' un'+(falta?'<br><span class="tag c">comprar</span>':'')+'</div></div>';}).join('')+'</div>'
      :'<div class="empty">Nenhuma peça do PCM ligada a este equipamento ainda.<br>Na versão final, os '+e.itens.filter(i=>i.cod).length+' códigos Sulmaq deste equipamento poderão virar peças de reposição.</div>';
  }
  if(S.aba==='man'){
    const M=e.man.filter(t=>bate(t.id+' '+t.tarefa+' '+t.tipo));
    h+=M.length?'<div class="list">'+M.map(t=>'<div class="row"><div class="t">'+esc(t.id)+'</div><div><div class="d">'+esc(t.tarefa)+'</div><div class="x">'+esc([t.tipo,t.per].filter(Boolean).join(' · '))+' · Última: '+esc(t.ult||'—')+' · Próxima: '+esc(t.prox||'—')+'</div></div><div class="r"><span class="tag '+(/atras/i.test(t.st)?'c':/vence|sem/i.test(t.st)?'w':'')+'">'+esc(t.st||'—')+'</span></div></div>').join('')+'</div>'
      :'<div class="empty">Sem plano de manutenção para '+esc(e.setor)+'.<br>Na versão final, as tarefas da aba Manutenção poderão ser criadas ou movidas para este Setor/TAG.</div>';
  }
  if(S.aba==='info'){
    const g=GRUPOS.map(n=>[n,e.itens.filter(i=>i.grp===n).length]);
    h+='<div class="box"><b>'+esc(e.nome)+'</b><div class="note">Setor/TAG: <b>'+esc(e.setor)+'</b> · Modelo Sulmaq: '+esc(e.modelo||'—')+' · OF: '+esc(e.of)+' · Quantidade: '+e.qtd+'</div></div><div class="sum">'+g.map(([n,c])=>'<div><b>'+c+'</b><span>'+esc(n)+'</span></div>').join('')+'</div>'+
      '<div class="note">Origem: planilha elétrica da planta nova (Sulmaq, layout elétrico 77461 rev. 2), cruzada com as abas Motores (TAG), Peças (código) e Manutenção (Setor/TAG) do PCM.</div>';
  }
  $('#view').innerHTML=h;
  $('#view').onclick=ev=>{const b=ev.target.closest('[data-a]');if(b){S.aba=b.dataset.a;render();}};
}
function serra(n){
  $('#ttl').textContent=n;
  const L=(SER[n]||[]).filter(p=>bate(p.id+' '+p.cod+' '+p.desc));
  $('#view').innerHTML='<div class="box"><b>'+esc(n)+'</b><div class="note">Equipamento dos manuais (não faz parte da planilha elétrica Sulmaq). Na versão final ele recebe um Setor/TAG e entra na lista da sua área.</div></div><div class="list">'+L.map(p=>'<div class="row"><div class="t">'+esc(p.item?'Item '+p.item:p.id)+'</div><div><div class="d">'+esc(p.desc)+'</div><div class="x">'+esc([p.cod&&p.cod!=='—'?p.cod:'sem código',p.fab,p.qtd?'qtd '+p.qtd:''].filter(Boolean).join(' · '))+'</div></div><div class="r">'+(p.est!==''&&p.est!=null?esc(p.est)+' un':'')+'</div></div>').join('')+'</div>';
  $('#view').onclick=null;
}
$('#bk').onclick=()=>{S.tela='lista';S.q='';$('#q').value='';render();};
$('#q').oninput=e=>{S.q=norm(e.target.value);clearTimeout(render.t);render.t=setTimeout(render,150);};
carrega();
})();
</script>
</body>
</html>
